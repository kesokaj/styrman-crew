<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>styrman dev console</title>
<link rel="stylesheet" href="vendor/xterm.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; height: 100vh; font: 13px/1.4 system-ui, sans-serif; background: #111; color: #ddd; }
  #sidebar { width: 260px; padding: 10px; background: #1a1a1a; overflow-y: auto; flex-shrink: 0; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #term { flex: 1; padding: 4px; background: #000; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .proj { padding: 6px 8px; margin: 2px 0; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
  .proj:hover { background: #2a2a2a; }
  .proj.active { background: #234; }
  .state { font-size: 11px; color: #888; }
  .state.running { color: #6c6; }
  form { margin: 12px 0; display: flex; flex-direction: column; gap: 6px; }
  input, select, button { padding: 6px; border-radius: 4px; border: 1px solid #333; background: #222; color: #ddd; }
  button { cursor: pointer; background: #235; }
  label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  #status { padding: 4px 10px; background: #1a1a1a; font-size: 12px; color: #999; }
  .convs { margin-left: 12px; font-size: 12px; }
  .conv { padding: 3px 6px; cursor: pointer; border-radius: 3px; }
  .conv:hover { background: #2a2a2a; }
  .conv.active { background: #345; }
</style>
</head>
<body>
<div id="sidebar">
  <h1>styrman <span style="color:#666">dev console</span></h1>
  <form id="newProject">
    <input name="name" placeholder="project-name" pattern="[a-z][a-z0-9-]{0,30}" required>
    <select name="agent"><option value="claude">claude</option><option value="agy">agy</option></select>
    <label><input type="checkbox" name="gitInit" checked> git init</label>
    <button>New Project</button>
  </form>
  <div id="projects"></div>
</div>
<div id="main">
  <div id="status">no project selected</div>
  <div id="term"></div>
</div>
<script src="vendor/xterm.min.js"></script>
<script src="vendor/addon-fit.min.js"></script>
<script src="app.js"></script>
</body>
</html>
