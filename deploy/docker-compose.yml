# styrman Phase 3 deployment: the vendored Caddy ingress (Google OAuth, TLS,
# Cloudflare DNS, label-based discovery) in front of the containerized
# styrman server. Copy .env.example → .env in this directory first.
#
# Boot survival: both services are restart: unless-stopped — a host reboot
# brings everything back via docker.service; no extra systemd unit needed.
services:
  caddy:
    container_name: styrman-caddy
    image: styrman-caddy:latest
    build:
      context: ./caddy
      network: host
    command: caddy ingress
    network_mode: host # direct access to container IPs on the bridge networks
    volumes:
      # NOTE: `:ro` only makes the socket FILE read-only — it does NOT restrict
      # the Docker API. This container has FULL Docker API access (it reads
      # container labels + IPs to generate the ingress config) and is trusted
      # accordingly. It is internet-facing, so treat any RCE in it as host root.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile.base:/etc/caddy/Caddyfile.base:ro
    env_file: .env
    environment:
      - CADDYFILE_BASE_PATH=/etc/caddy/Caddyfile.base
      # Public preview links (1.1): when set, the ingress adds a *.PREVIEW_DOMAIN
      # public wildcard → the server, plus its DNS + cert. Empty = feature off.
      - PREVIEW_DOMAIN=${STYRMAN_PUBLIC_DOMAIN:-}
      # Private share links (1.2): when set, the ingress adds a *.PRIVATE_DOMAIN
      # OAuth-gated wildcard → the server (DNS + cert too). Empty = feature off.
      - PRIVATE_DOMAIN=${STYRMAN_PRIVATE_DOMAIN:-}
    dns: [8.8.8.8, 1.1.1.1]
    restart: unless-stopped

  styrman:
    container_name: styrman-server
    # :latest is the running tag; the deployed version is baked into the binary
    # (STYRMAN_VERSION build-arg, shown in logs/UI) and every release is git-
    # tagged. Roll back by rebuilding at the desired tag: `git checkout vX.Y.Z &&
    # STYRMAN_VERSION=X.Y.Z docker compose build/up styrman`.
    image: styrman-server:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        # Stamp the binary's reported version (falls back to 0.0.0). Set e.g.
        # `STYRMAN_VERSION=1.0.0 docker compose ... up -d --build`.
        STYRMAN_VERSION: '${STYRMAN_VERSION:-0.0.0}'
      network: host
    # The operator's uid:gid (files created in the per-project homes must match
    # the in-guest user) + the host's docker group for the socket.
    user: '${STYRMAN_UID}:${STYRMAN_GID}'
    group_add:
      - '${DOCKER_GID}'
    # The server originates connections to each project (port-preview proxy)
    # but must NEVER route between the project networks it is attached to —
    # that would defeat per-project isolation. ip_forward off makes it
    # structurally incapable of being used as a cross-project router.
    sysctls:
      - net.ipv4.ip_forward=0
    environment:
      - STYRMAN_ADDR=0.0.0.0:8080
      - STYRMAN_AUTH=header
      - STYRMAN_ALLOWED_EMAILS=${STYRMAN_ALLOWED_EMAILS}
      - STYRMAN_USER=${STYRMAN_USER}
      - STYRMAN_IMAGE=${STYRMAN_IMAGE:-styrman-runtime:latest}
      - STYRMAN_KEYRING_PW=${STYRMAN_KEYRING_PW:?set STYRMAN_KEYRING_PW in deploy/.env (host-setup.sh generates one)}
      - STYRMAN_IDLE_TIMEOUT=${STYRMAN_IDLE_TIMEOUT:-24h}
      - HOME=/var/lib/styrman # user.Current() needs a home for uid lookups
      - STYRMAN_SELF_CONTAINER=styrman-server
      # Optional: when set (and injected by the Caddy ingress as
      # X-Styrman-Ingress), header-mode requests without it are rejected —
      # blocks a project VM on the shared bridge from spoofing X-Caddy-Email
      # directly against :8080. Enable with the ingress in Batch A part 2.
      - STYRMAN_INGRESS_TOKEN=${STYRMAN_INGRESS_TOKEN:-}
      # Credential broker listener (ADR-030/032; default :8091). It binds in
      # the CONTAINER only and answers on each project bridge at a fixed IP —
      # NEVER publish it to the host: caller identity is bridge position.
      - STYRMAN_BROKER_ADDR=${STYRMAN_BROKER_ADDR:-:8091}
      # Public preview links (1.1): must equal the ingress PREVIEW_DOMAIN so a
      # <token>.PREVIEW_BASE subdomain resolves to the link. Empty = off.
      - STYRMAN_PREVIEW_BASE=${STYRMAN_PUBLIC_DOMAIN:-}
      # Private share links (1.2): must equal the ingress PRIVATE_DOMAIN.
      - STYRMAN_PRIVATE_BASE=${STYRMAN_PRIVATE_DOMAIN:-}
    # SECURITY: no auth-bypass dev listener in production. It bound 0.0.0.0
    # inside a container joined to every project bridge, handing any project
    # VM unauthenticated admin (confirmed live in the 2026-08-27 review). Local
    # testing without OAuth uses a HOST server on 127.0.0.1 (integration.sh /
    # e2e), which project VMs cannot reach.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside as on the host: bind sources passed to project
      # containers must be valid host paths.
      - /var/lib/styrman:/var/lib/styrman
    networks: [styrman-ingress]
    labels:
      # Discovered by the vendored ingress: https://${STYRMAN_HOSTNAME}.${BASE_DOMAIN}
      caddy: 'true'
      caddy_hostname: '${STYRMAN_HOSTNAME:-styrman}'
      caddy_port: '8080'
      # ModeAuthenticated: any Google account may sign in and reach the server,
      # but the server's authGuard is the real gate — it 403s every request
      # whose X-Caddy-Email is not in the userstore, EXCEPT port previews a
      # project owner shared with that email. This is what makes port-sharing
      # deployable: a shared guest signs in with Google and sees ONLY the
      # previews shared with them. Admin rights come from STYRMAN_ALLOWED_EMAILS
      # (server env, above) via the userstore — NOT from an ingress role, so a
      # guest can never become an admin by being allowed through the ingress.
      # Backs the public preview wildcard (*.PREVIEW_DOMAIN) when enabled.
      caddy_preview_target: 'true'
    restart: unless-stopped

networks:
  styrman-ingress:
    name: styrman-ingress
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
