# deploy/gcp/vm.conf — the styrman GCP target's non-secret defaults (plan
# .agents/docs/plans/2026-09-21-gcp-compute-engine-target.md, ADR-075).
# Every key can be overridden from the environment: a GCP_* value already set
# when vm.sh/install.sh run wins over this file. Secrets never live here — they
# are the three files in ~/.config/styrman/gcp/ (.agents/docs/deploy/gcp.md).
GCP_PROJECT=driven-eft-h4it
GCP_ZONE=europe-north2-a
GCP_SUBNET=europe-north2
GCP_INSTANCE=styrman
# Nested virtualization (Kata needs /dev/kvm) is refused by Google on E2,
# Arm, memory-optimized and every AMD family but N4D: keep an Intel type.
GCP_MACHINE_TYPE=n4-standard-8
GCP_BOOT_DISK_SIZE=200GB
# N4 boots from Hyperdisk Balanced only.
GCP_BOOT_DISK_TYPE=hyperdisk-balanced
GCP_IMAGE_FAMILY=debian-13
GCP_IMAGE_PROJECT=debian-cloud
# Target tags matching the project's existing firewall rules: 80 and 443 only —
# ssh goes through IAP (below), so the VM has no public port 22.
GCP_TAGS=http,https
# 1: ssh and scp tunnel through Identity-Aware Proxy TCP forwarding (the
# project's allow-iap rule, 35.235.240.0/20; the caller needs
# roles/iap.tunnelResourceAccessor). 0: the public path — then add the `ssh`
# tag to GCP_TAGS. Found during the first bring-up (BUG record in the plan):
# the operator's own network dropped port 22 to the new VM within a minute
# while internet scanners were already probing it.
GCP_SSH_VIA_IAP=1
# The reserved external IP's name (region = the zone's); a stable address is
# what keeps the Cloudflare records the ingress writes stable.
GCP_ADDRESS=styrman-static
