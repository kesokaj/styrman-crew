# styrman default tmux config (deployed once; user edits win afterwards).
# The terminal UI provides the chrome — hide tmux's own status bar.
set -g status off
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g escape-time 10
set -g mouse on
# Panes run login shells so /etc/profile.d (keyring, PATH) always applies.
set -g default-command "/bin/bash -l"
# Per-project transcript logging (written by the entrypoint).
source-file -q /etc/styrman/tmux-project.conf
